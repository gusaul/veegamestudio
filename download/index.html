<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Orbital 2048 | Vee Game Studio</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Mobile optimization -->
    <meta name="theme-color" content="#0B0E11">

    <style>
        :root {
            --accent-purple: #7F56D9;
            --accent-blue: #00D1FF;
            --bg-dark: #07090D;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Premium Background Layers */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            z-index: 0;
        }

        .bg-glow-one {
            position: absolute;
            top: 20%;
            left: 50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(127, 86, 217, 0.15), transparent 70%);
            transform: translate(-50%, -50%);
            filter: blur(60px);
            z-index: 1;
        }

        .download-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 3.5rem 2rem;
            max-width: 420px;
            width: 100%;
            z-index: 10;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-icon-wrapper {
            position: relative;
            margin-bottom: 2rem;
            display: inline-block;
            animation: float 6s ease-in-out infinite;
        }

        .game-icon {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .icon-glow {
            position: absolute;
            inset: -15px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            filter: blur(25px);
            opacity: 0.3;
            z-index: -1;
            border-radius: 40px;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.25rem;
            margin: 0 0 0.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(to bottom, #FFF, #A5A5A5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin-bottom: 3rem;
            font-weight: 400;
            line-height: 1.5;
        }

        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            align-items: center;
        }

        .cta-link {
            width: 100%;
            display: block;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cta-link:hover {
            transform: scale(1.05);
        }

        .cta-badge {
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .back-home {
            margin-top: 3rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .back-home:hover {
            color: #FFF;
            transform: translateY(-1px);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .download-card {
                padding: 2.5rem 1.5rem;
                background: transparent;
                border: none;
                backdrop-filter: none;
                box-shadow: none;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>

    <!-- SEO -->
    <meta name="description"
        content="Get Orbital 2048 now on iOS and Android. The ultimate slingshot puzzle experience by Vee Game Studio.">
</head>

<body>
    <div class="bg-grid"></div>
    <div class="bg-glow-one"></div>

    <div class="download-card">
        <div class="game-icon-wrapper">
            <div class="icon-glow"></div>
            <img src="../images/2048inOrbit.png" alt="Orbital 2048 Icon" class="game-icon">
        </div>

        <h1>Orbital 2048</h1>
        <p class="tagline">Experience incredibly satisfying <br>wobbly ball merging.</p>

        <div class="cta-group">
            <a href="https://play.google.com/store/apps/details?id=com.veegamestudio.orbital_2048" class="cta-link"
                target="_blank">
                <img src="../images/playstore.png" alt="Get it on Google Play" class="cta-badge">
            </a>

            <a href="https://apps.apple.com/us/app/2048-in-orbit-slingshot/id6757601433" class="cta-link"
                target="_blank">
                <img src="../images/appstore.png" alt="Download on the App Store" class="cta-badge">
            </a>
        </div>
    </div>
</body>

</html>
